[general]
; key that opens and closes the menu: Insert, Home, F1..F24, A..Z, Numpad0..9, or a
; virtual-key code like 0x2D
MenuKey=Insert
Log=1
; empty = bm2dx.dll or bm2dx_omni.dll
Module=

[timing]
; keeps the chart on the audio position; only real dropped frames and drift are corrected (60 Hz LDJ / 120 Hz TDJ)
MillisecondClock=1

[system]
; keep Windows from slowing the game down to save power (EcoQoS, timer throttling)
NoPowerThrottling=1
; register the render thread with MMCSS "Games" (skipped when the process priority is high or realtime)
Mmcss=1
; normal, above or high
ProcessPriority=normal

[random]
; applies when the game option is RANDOM; P1/P2 = screen order, keys counted left to right
Enabled=0
P1=1234567
P1Ran=0
P1Group=0
P2=1234567
P2Ran=0
P2Group=0

[chart]
; plays are reported as AUTO SCRATCH assist plays; only one of the two at a time
AllScratch=0
AllCharge=0

[effects]
; percent, 100 = unchanged
BombOpacity=100
BeamOpacity=100
JudgeOpacity=100
PGreatBlue=0
NoBlink=0